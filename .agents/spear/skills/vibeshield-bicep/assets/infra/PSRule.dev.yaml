#
# Sample PSRule for Azure Configuration - DEVELOPMENT
# This file will get copied to your project and should be customized for your dev environment.
# Reference: https://aka.ms/ps-rule-azure/options
#
# Usage: Assert-PSRule -Option PSRule.dev.yaml
#
# PURPOSE:
#   This file relaxes PSRule checks that are cost- or availability-driven so
#   that dev/prototype environments stay cheap and flexible. Rules excluded
#   here map to WAF Cost Optimization (CO) and Reliability (RE) pillars:
#   fewer nodes, no geo-replication, no availability zones, no WAF SKU, etc.
#
# WHAT IS NEVER RELAXED:
#   Security (SE), Identity (SE:05), Zero Trust (SE:06), and audit logging
#   rules are enforced here exactly as in prod. Private endpoints, Defender,
#   Entra-only auth, lateral-traversal deny rules, and audit logs are
#   non-negotiable in every environment — dev bugs found under relaxed
#   security are not real bugs.
#
# SUPPRESSION vs EXCLUSION:
#   - rule.exclude: Global exclusions for entire rule categories (cost, HA).
#   - suppression: Per-resource exceptions for Azure platform constraints
#     (e.g., App Gateway subnet) or documented dev trade-offs (e.g., Key
#     Vault purge protection disabled for teardown flexibility).
#
# LIFECYCLE:
#   Temporary suppressions are removed when the backing feature is
#   implemented. Removed entries are kept as comments ("# REMOVED in
#   Step X") so the history is visible in-file.
#
# See Documentation/PSRule-Governance.md for full decision framework.
#

# Require minimum version of PSRule for Azure
requires:
  PSRule.Rules.Azure: '>=1.34.0'

# Automatically use rules for Azure
include:
  module:
  - PSRule.Rules.Azure

# Configure input file processing
input:
  pathIgnore:
    # Exclude all files at any depth
    # Note: also exclude bicep modules because they're analyzed via main.bicep expansion
    - '**'
    # Only process main.bicep file
    - '!**/main.bicep'

# Configure output
output:
  culture:
  - 'en-US'
  style: GitHubActions

# Azure-specific configuration
configuration:
  # Enable Bicep expansion - REQUIRED to analyze Bicep files
  AZURE_BICEP_FILE_EXPANSION: true
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 60
  
  # Parameter file for Bicep expansion (relative to infra folder)
  AZURE_BICEP_PARAMS_FILE: 'parameters.dev.bicepparam'

  # Default parameter values for PSRule expansion (required params not in .bicepparam)
  # IMPORTANT: Must match $script:Project in scripts/powershell/Config.ps1
  AZURE_PARAMETER_DEFAULTS:
    project: '{{REPLACE-WITH-11-CHAR-PROJECT-NAME}}' # e.g., ldat081319

  # Mock deployment context for static analysis (DEV)
  AZURE_DEPLOYMENT:
    name: 'main'
    location: 'centralus'
  
  # Mock resource group context - provides location for resourceGroup().location
  # IMPORTANT: Must match Get-ResourceGroupName output from Config.ps1
  AZURE_RESOURCE_GROUP:
    name: 'rg-{{REPLACE-WITH-11-CHAR-PROJECT-NAME}}-dev-cus'
    location: 'centralus'

  # Allowed Azure regions for resources
  AZURE_RESOURCE_ALLOWED_LOCATIONS:
  - 'centralus'

  # Minimum Kubernetes version for AKS
  AZURE_AKS_CLUSTER_MINIMUM_VERSION: '1.28.0'

# ============================================================================
# Rule Configuration - DEV ENVIRONMENT
# Exclude rules that are not applicable for development environment
# ============================================================================
rule:
  exclude:
    # ----------------------------------------------------------------------------
    # Cost Optimization for Dev
    # ----------------------------------------------------------------------------
    - 'Azure.AKS.MinNodeCount'          # Allow fewer nodes for dev cost savings
    - 'Azure.AKS.MinUserPoolNodes'      # User pool not required for dev
    - 'Azure.ACR.GeoReplica'            # Geo-replication not needed for dev ACR
    - 'Azure.ACR.SoftDelete'            # Soft delete disabled for dev to reduce storage costs

    # ----------------------------------------------------------------------------
    # Availability Zones - Not required for dev workloads
    # ----------------------------------------------------------------------------
    - 'Azure.AKS.AvailabilityZone'      # AZ not required for dev workloads
    - 'Azure.AppGw.AvailabilityZone'    # AZ not required for dev workloads
    - 'Azure.PublicIP.AvailabilityZone' # AZ not required for dev workloads

    # ----------------------------------------------------------------------------
    # Application Gateway - WAF and HTTPS not required for dev
    # ----------------------------------------------------------------------------
    - 'Azure.AppGw.UseWAF'              # WAF SKU not cost-effective for dev environment
    - 'Azure.AppGw.UseHTTPS'            # HTTP-to-HTTPS redirect will be configured with actual workload deployment
    - 'Azure.AppGw.SSLPolicy'           # TLS policy will be configured when HTTPS is enabled
    - 'Azure.AppGw.WAFEnabled'          # WAF not required for dev workloads

    # ----------------------------------------------------------------------------
    # VM Standalone - Single instance acceptable for dev Jumpbox
    # ----------------------------------------------------------------------------
    - 'Azure.VM.Standalone'             # Single instance Jumpbox acceptable for dev, not production workload

    # ----------------------------------------------------------------------------
    # Highly available Monitoring - Not required for dev
    # ----------------------------------------------------------------------------
    - 'Azure.AKS.AuditAdmin'            # Dev uses kube-audit (verbose) intentionally for debugging; prod uses kube-audit-admin
    - 'Azure.Log.Replication'           # Log Analytics replication not required for dev

    # ----------------------------------------------------------------------------
    # AKS Dev-Specific Features
    # ----------------------------------------------------------------------------
    - 'Azure.AKS.NodeMinPods'           # Lower pod density acceptable for dev workloads
    - 'Azure.AKS.EphemeralOSDisk'       # Ephemeral disks not required for dev, standard managed disks sufficient

    # ----------------------------------------------------------------------------
    # Network - Accepted risks for dev
    # ----------------------------------------------------------------------------
    - 'Azure.NSG.LateralTraversal'      # Jumpbox subnet requires outbound SSH for administrative troubleshooting

    # ----------------------------------------------------------------------------
    # Architecture-Specific (same as prod)
    # ----------------------------------------------------------------------------
    - 'Azure.PublicIP.IsAttached'       # Bastion and NAT Gateway require public IPs - this is expected
    - 'Azure.NSG.AKSRules'              # NSG on AKS subnets managed by Azure CNI

# ============================================================================
# Suppressions - Per-resource exceptions
# ============================================================================
suppression:

  # Purge protection intentionally disabled in dev for clean teardowns
  # Once enabled, purge protection cannot be disabled, blocking vault name reuse after teardown
  # See main.bicep enableKeyVaultPurgeProtection parameter comments for details
  #Azure.KeyVault.PurgeProtect:
  #  - kv-{{REPLACE-WITH-11-CHAR-PROJECT-NAME}}-cus01    # Dev Key Vault - purge protection disabled for teardown flexibility
