# VibeShield-Bicep Extension Hooks for Spec Kit
#
# This file integrates vibeshield-bicep into the spec-kit agent lifecycle.
# It is installed to .specify/extensions.yml by Install-SpecKitIntegration.ps1.
#
# Spec-kit agents check for this file at lifecycle boundaries (before/after
# each command). Mandatory hooks auto-execute; optional hooks are offered
# to the user. This file survives 'specify init --force' because the
# specify CLI does not manage extensions.yml.
#
# Hook schema:
#   extension: <skill name>
#   command: <agent slash-command to invoke>
#   description: <human-readable purpose>
#   prompt: <context passed to the invoked agent>
#   optional: true|false (false = auto-execute, true = user chooses)
#   enabled: true|false (false = skip this hook entirely)

hooks:
  before_specify:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Review SFI non-functional requirements for infrastructure features
      prompt: >-
        Review the feature description for infrastructure scope. If the feature
        involves Azure infrastructure, remind the user that SFI non-functional
        requirements (network isolation, managed identity, no secrets, current
        components) and WAF pillar considerations must be included in the
        specification. Provide guidance on what to include.
      optional: true
      enabled: true

  after_specify:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Verify SFI non-functional requirement coverage in spec
      prompt: >-
        Review the generated specification for SFI compliance coverage. Check
        that infrastructure features include non-functional requirements for
        network isolation, managed identity, no secrets in code, and current
        components. Flag any gaps as recommendations.
      optional: true
      enabled: true

  before_plan:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Consult MCP servers for infrastructure best practices before planning
      prompt: >-
        The planning phase is about to begin for a feature that may involve
        Azure infrastructure. Consult the Bicep MCP server for best practices
        (get_bicep_best_practices), check for Azure Verified Modules
        (list_avm_metadata) covering the resource types in the spec, and
        retrieve WAF pillar guidance from the Azure MCP server
        (get_bestpractices) for each resource type. Report findings so
        the plan agent can incorporate them into research.md and the
        architecture design.
      optional: false
      enabled: true

  after_plan:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Review plan for SFI and WAF alignment
      prompt: >-
        Review the generated plan for SFI security compliance and WAF
        alignment. Check that the architecture design includes network
        isolation, managed identity, no secrets patterns, and appropriate
        WAF pillar coverage. Flag any violations or gaps.
      optional: true
      enabled: true

  before_tasks:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Provide validation checkpoint guidance for task generation
      prompt: >-
        The task generation phase is about to begin. If the plan includes
        Bicep templates or PowerShell scripts, advise on where validation
        checkpoint tasks should be inserted (after each module, after
        main.bicep composition, and as a pre-commit sweep). Provide the
        specific task descriptions and delegation annotations.
      optional: true
      enabled: true

  before_implement:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Confirm infrastructure design readiness before implementation
      prompt: >-
        Implementation is about to begin. Review the plan and tasks for
        infrastructure readiness. Confirm that Bicep module design is
        complete, AVM modules are identified, SFI constraints are encoded,
        and validation checkpoints are present in the task list. Flag any
        blockers before implementation proceeds.
      optional: false
      enabled: true

  after_implement:
    - extension: vibeshield-bicep
      command: vibeshield-bicep
      description: Run full Tier 2 validation sweep on all infrastructure code
      prompt: >-
        Implementation is complete. Run a full Tier 2 validation sweep on
        all .bicep files using the vibeshield-bicep skill
        (Invoke-BicepValidation.ps1). Also validate all .ps1/.psm1 files
        by delegating to @vibeshield-powershell. Report validation results
        and any violations that must be fixed before commit.
      optional: false
      enabled: true
