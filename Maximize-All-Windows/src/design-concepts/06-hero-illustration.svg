<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desktopBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0a1b2e"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0"   stop-color="#eaf3fb"/>
      <stop offset="1" stop-color="#cfe3f5"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#111">Concept F — Brand illustration on the right (no AT detection, stays maximized)</text>
  <text x="40" y="58" font-size="14" fill="#555">The window keeps opening maximized (it's the app's identity). The previously empty right half becomes a hero illustration that shows what the app does: a small window growing to fill the screen. Visible at any zoom, no Magnifier sniffing required.</text>

  <rect x="40" y="80" width="1200" height="720" fill="url(#desktopBg)" rx="6"/>

  <g filter="url(#shadow)">
    <!-- title bar -->
    <rect x="40" y="80" width="1200" height="36" fill="#fafafa"/>
    <text x="60" y="103" font-size="13" fill="#222">Maximize All Windows</text>
    <g transform="translate(1145,80)" fill="#444">
      <text x="0"  y="23" font-size="16">—</text>
      <rect x="38" y="11" width="14" height="14" fill="none" stroke="#444"/>
      <text x="78" y="23" font-size="16">✕</text>
    </g>

    <!-- sidebar -->
    <rect x="40" y="116" width="220" height="628" fill="#f3f3f3"/>
    <rect x="40" y="132" width="3"  height="36"  fill="#0078d4"/>
    <text x="64" y="156" font-size="14" font-weight="600" fill="#111">Settings</text>
    <text x="64" y="196" font-size="14" fill="#333">About</text>

    <!-- content surface (left half) -->
    <rect x="260" y="116" width="580" height="628" fill="#ffffff"/>

    <text x="292" y="170" font-size="28" font-weight="700" fill="#111">Settings</text>
    <text x="292" y="196" font-size="13" fill="#666">Configure how Maximize All Windows behaves.</text>

    <text x="292" y="246" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">GENERAL</text>
    <rect x="292" y="262" width="16" height="16" rx="2" fill="#fff" stroke="#666"/>
    <polyline points="296,270 302,276 312,266" fill="none" stroke="#0078d4" stroke-width="2"/>
    <text x="318" y="276" font-size="14" fill="#111">Start with Windows</text>

    <text x="292" y="324" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">APPEARANCE</text>
    <text x="292" y="348" font-size="13" fill="#111">Show in</text>
    <circle cx="300" cy="370" r="8" fill="#fff" stroke="#666"/>
    <circle cx="300" cy="370" r="4" fill="#0078d4"/>
    <text x="316" y="374" font-size="14" fill="#111">System tray</text>
    <circle cx="300" cy="394" r="8" fill="#fff" stroke="#666"/>
    <text x="316" y="398" font-size="14" fill="#111">Taskbar</text>

    <!-- ===== hero illustration panel (right half) ===== -->
    <rect x="840" y="116" width="400" height="628" fill="url(#heroBg)"/>
    <rect x="840" y="116" width="1"   height="628" fill="#cfd8e3"/>
    <!-- subtle accent glow at top -->
    <rect x="840" y="116" width="400" height="200" fill="url(#accentGlow)"/>

    <!-- illustration: small window -> big window animation, frozen as 3 stacked frames -->
    <!-- Frame 1: smallest, top-left -->
    <g filter="url(#softShadow)" opacity="0.55">
      <rect x="900" y="220" width="150" height="100" rx="6" fill="#ffffff" stroke="#b6c4d4"/>
      <rect x="900" y="220" width="150" height="18"  rx="6" fill="#dde6f0"/>
      <rect x="900" y="232" width="150" height="6"             fill="#dde6f0"/>
      <circle cx="912" cy="229" r="3" fill="#ff5f57"/>
      <circle cx="922" cy="229" r="3" fill="#febc2e"/>
      <circle cx="932" cy="229" r="3" fill="#28c840"/>
      <rect x="912" y="252" width="80" height="6" rx="3" fill="#cfd8e3"/>
      <rect x="912" y="266" width="120" height="4" rx="2" fill="#e1e8f0"/>
      <rect x="912" y="276" width="100" height="4" rx="2" fill="#e1e8f0"/>
      <rect x="912" y="286" width="90"  height="4" rx="2" fill="#e1e8f0"/>
    </g>

    <!-- Frame 2: medium, middle -->
    <g filter="url(#softShadow)" opacity="0.78">
      <rect x="920" y="290" width="230" height="160" rx="7" fill="#ffffff" stroke="#a8b8cc"/>
      <rect x="920" y="290" width="230" height="22"  rx="7" fill="#cddbeb"/>
      <rect x="920" y="305" width="230" height="7"              fill="#cddbeb"/>
      <circle cx="934" cy="301" r="3.5" fill="#ff5f57"/>
      <circle cx="946" cy="301" r="3.5" fill="#febc2e"/>
      <circle cx="958" cy="301" r="3.5" fill="#28c840"/>
      <rect x="934" y="328" width="120" height="7" rx="3" fill="#bccada"/>
      <rect x="934" y="346" width="180" height="5" rx="2" fill="#d6dfea"/>
      <rect x="934" y="360" width="160" height="5" rx="2" fill="#d6dfea"/>
      <rect x="934" y="374" width="140" height="5" rx="2" fill="#d6dfea"/>
      <rect x="934" y="388" width="170" height="5" rx="2" fill="#d6dfea"/>
    </g>

    <!-- Frame 3: full, "maximized" — outlined to suggest the screen edge -->
    <g filter="url(#softShadow)">
      <rect x="876" y="380" width="328" height="240" rx="8" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
      <rect x="876" y="380" width="328" height="26"  rx="8" fill="#0078d4"/>
      <rect x="876" y="398" width="328" height="8"              fill="#0078d4"/>
      <circle cx="892" cy="393" r="4" fill="#ff5f57"/>
      <circle cx="906" cy="393" r="4" fill="#febc2e"/>
      <circle cx="920" cy="393" r="4" fill="#28c840"/>
      <text x="1188" y="397" font-size="11" fill="#fff" text-anchor="end">— ▢ ✕</text>
      <rect x="896" y="424" width="160" height="9" rx="3" fill="#b6c4d4"/>
      <rect x="896" y="446" width="284" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="462" width="260" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="478" width="240" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="494" width="270" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="510" width="220" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="526" width="260" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="542" width="180" height="6" rx="2" fill="#dde6f0"/>
      <rect x="896" y="572" width="120" height="22" rx="3" fill="#0078d4"/>
      <text x="956" y="588" font-size="11" fill="#fff" text-anchor="middle">Maximized</text>
    </g>

    <!-- motion arrows from small -> big -->
    <g stroke="#0078d4" stroke-width="2.2" fill="none" opacity="0.85">
      <path d="M 1040 230 C 1090 250, 1110 270, 1110 300" marker-end="url(#arrow)"/>
      <path d="M 1140 300 C 1170 330, 1180 360, 1180 395" marker-end="url(#arrow)"/>
    </g>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/>
      </marker>
    </defs>

    <!-- caption -->
    <text x="1040" y="166" font-size="16" font-weight="700" fill="#0a4978" text-anchor="middle">Every window, full screen</text>
    <text x="1040" y="188" font-size="12" fill="#37607e" text-anchor="middle">Less hunting for tiny windows. More focus.</text>

    <!-- footer -->
    <rect x="40" y="744" width="1200" height="56" fill="#f9f9f9"/>
    <text x="60" y="778" font-size="12" fill="#666">Version RC2 build 59 (dark-tray-menu)</text>
    <g transform="translate(960,756)">
      <rect x="0"   y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="32"  y="20" font-size="13" fill="#111">OK</text>
      <rect x="92"  y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="116" y="20" font-size="13" fill="#111">Cancel</text>
      <rect x="184" y="0" width="84" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="200" y="20" font-size="13" fill="#111">Exit App</text>
    </g>
  </g>

  <!-- magnifier viewport parked on the right — now lands on the illustration -->
  <g>
    <rect x="820" y="200" width="420" height="440" fill="none" stroke="#ffd633" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="820" y="166" width="280" height="28" fill="#222"/>
    <text x="830" y="186" font-size="13" font-weight="600" fill="#ffd633">Magnifier panned right — content</text>
  </g>

  <g transform="translate(40,820)">
    <text x="0" y="12" font-size="12" fill="#222"><tspan font-weight="700">Implementation:</tspan> ship a single PNG/SVG resource embedded in the assembly; draw it in a <tspan font-family="Consolas, monospace">PictureBox</tspan> docked to a third column in the body <tspan font-family="Consolas, monospace">TableLayoutPanel</tspan>. SizeMode = Zoom so it scales with the window.</text>
  </g>
</svg>
