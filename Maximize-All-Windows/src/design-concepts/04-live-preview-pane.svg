<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desktopBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0a1b2e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#111">Concept D — Live preview pane on the right</text>
  <text x="40" y="58" font-size="14" fill="#555">Show a miniature, real-time illustration of the chosen behavior. When the user toggles “System tray” vs “Taskbar,” the preview swaps. The right side becomes purposeful and visually distinctive — easy to find under magnification.</text>

  <rect x="40" y="80" width="1200" height="720" fill="url(#desktopBg)" rx="6"/>

  <g filter="url(#shadow)">
    <rect x="40" y="80" width="1200" height="36" fill="#fafafa"/>
    <text x="60" y="103" font-size="13" fill="#222">Maximize All Windows</text>
    <g transform="translate(1145,80)" fill="#444">
      <text x="0"  y="23" font-size="16">—</text>
      <rect x="38" y="11" width="14" height="14" fill="none" stroke="#444"/>
      <text x="78" y="23" font-size="16">✕</text>
    </g>

    <!-- sidebar -->
    <rect x="40" y="116" width="220" height="628" fill="#f3f3f3"/>
    <rect x="40" y="132" width="3"  height="36"  fill="#0078d4"/>
    <text x="64" y="156" font-size="14" font-weight="600" fill="#111">Settings</text>
    <text x="64" y="196" font-size="14" fill="#333">About</text>

    <!-- main content surface -->
    <rect x="260" y="116" width="620" height="628" fill="#ffffff"/>

    <text x="292" y="170" font-size="28" font-weight="700" fill="#111">Settings</text>
    <text x="292" y="196" font-size="13" fill="#666">Configure how Maximize All Windows behaves.</text>

    <text x="292" y="246" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">GENERAL</text>
    <rect x="292" y="262" width="16" height="16" rx="2" fill="#fff" stroke="#666"/>
    <polyline points="296,270 302,276 312,266" fill="none" stroke="#0078d4" stroke-width="2"/>
    <text x="318" y="276" font-size="14" fill="#111">Start with Windows</text>

    <text x="292" y="334" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">APPEARANCE</text>
    <text x="292" y="358" font-size="13" fill="#111">Show in</text>
    <circle cx="300" cy="380" r="8" fill="#fff" stroke="#666"/>
    <circle cx="300" cy="380" r="4" fill="#0078d4"/>
    <text x="316" y="384" font-size="14" fill="#111" font-weight="600">System tray</text>
    <circle cx="300" cy="404" r="8" fill="#fff" stroke="#666"/>
    <text x="316" y="408" font-size="14" fill="#111">Taskbar</text>

    <!-- preview pane -->
    <rect x="880" y="116" width="360" height="628" fill="#eef3f8"/>
    <rect x="880" y="116" width="1"   height="628" fill="#dde3eb"/>

    <text x="908" y="160" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">PREVIEW</text>
    <text x="908" y="186" font-size="16" font-weight="700" fill="#111">Where you'll find it</text>

    <!-- mini desktop preview -->
    <rect x="908" y="210" width="304" height="200" rx="6" fill="#1f3a5f" stroke="#cfd8e3"/>
    <rect x="908" y="380" width="304" height="30"  rx="0" fill="#1f1f1f"/>
    <!-- desktop icons -->
    <rect x="924" y="226" width="40" height="40" rx="4" fill="#ffffff30"/>
    <rect x="924" y="280" width="40" height="40" rx="4" fill="#ffffff30"/>
    <!-- taskbar items -->
    <rect x="1056" y="386" width="18" height="18" rx="2" fill="#444"/>
    <rect x="1080" y="386" width="18" height="18" rx="2" fill="#444"/>
    <rect x="1104" y="386" width="18" height="18" rx="2" fill="#444"/>
    <!-- system tray section with our icon highlighted -->
    <rect x="1140" y="384" width="68" height="22" fill="#262626" stroke="#0078d4"/>
    <rect x="1148" y="388" width="14" height="14" rx="2" fill="#0078d4"/>
    <text x="1148" y="402" font-size="10" fill="#fff">✦</text>
    <rect x="1172" y="388" width="14" height="14" rx="2" fill="#666"/>
    <rect x="1190" y="388" width="14" height="14" rx="2" fill="#666"/>

    <!-- callout arrow -->
    <path d="M 1162 384 C 1162 360, 1140 350, 1100 350" fill="none" stroke="#0078d4" stroke-width="2"/>
    <text x="938" y="346" font-size="12" font-weight="600" fill="#0078d4">App lives here in the system tray</text>

    <text x="908" y="450" font-size="13" fill="#222">
      <tspan x="908" dy="0">Right-click the tray icon for</tspan>
      <tspan x="908" dy="20">quick actions; double-click to</tspan>
      <tspan x="908" dy="20">open this Settings window.</tspan>
    </text>

    <!-- footer -->
    <rect x="40" y="744" width="1200" height="56" fill="#f9f9f9"/>
    <text x="60" y="778" font-size="12" fill="#666">Version RC2 build 59 (dark-tray-menu)</text>
    <g transform="translate(960,756)">
      <rect x="0"   y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="32"  y="20" font-size="13" fill="#111">OK</text>
      <rect x="92"  y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="116" y="20" font-size="13" fill="#111">Cancel</text>
      <rect x="184" y="0" width="84" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="200" y="20" font-size="13" fill="#111">Exit App</text>
    </g>
  </g>

  <!-- magnifier viewport on the preview -->
  <g>
    <rect x="860" y="180" width="380" height="280" fill="none" stroke="#ffd633" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="860" y="146" width="240" height="28" fill="#222"/>
    <text x="870" y="166" font-size="13" font-weight="600" fill="#ffd633">Magnifier panned right</text>
  </g>

  <g transform="translate(40,820)">
    <text x="0" y="12" font-size="12" fill="#222"><tspan font-weight="700">Bonus:</tspan> the preview also teaches sighted users where the tray icon actually lands after install — a common support question today.</text>
  </g>
</svg>
