<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desktopBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0a1b2e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#111">Concept C — Contextual help pane on the right</text>
  <text x="40" y="58" font-size="14" fill="#555">A second column (~360 px) docked right shows the description, “why it matters,” and a tip for whichever setting has focus. The blank space becomes useful content that travels with the user.</text>

  <rect x="40" y="80" width="1200" height="720" fill="url(#desktopBg)" rx="6"/>

  <g filter="url(#shadow)">
    <!-- title bar -->
    <rect x="40" y="80" width="1200" height="36" fill="#fafafa"/>
    <text x="60" y="103" font-size="13" fill="#222">Maximize All Windows</text>
    <g transform="translate(1145,80)" fill="#444">
      <text x="0"  y="23" font-size="16">—</text>
      <rect x="38" y="11" width="14" height="14" fill="none" stroke="#444"/>
      <text x="78" y="23" font-size="16">✕</text>
    </g>

    <!-- sidebar -->
    <rect x="40" y="116" width="220" height="628" fill="#f3f3f3"/>
    <rect x="40" y="132" width="3"  height="36"  fill="#0078d4"/>
    <text x="64" y="156" font-size="14" font-weight="600" fill="#111">Settings</text>
    <text x="64" y="196" font-size="14" fill="#333">About</text>

    <!-- main content surface -->
    <rect x="260" y="116" width="660" height="628" fill="#ffffff"/>

    <text x="292" y="170" font-size="28" font-weight="700" fill="#111">Settings</text>
    <text x="292" y="196" font-size="13" fill="#666">Configure how Maximize All Windows behaves.</text>

    <text x="292" y="246" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">GENERAL</text>
    <!-- focused row -->
    <rect x="282" y="258" width="620" height="44" fill="#eef6fc" stroke="#0078d4" stroke-width="1" rx="4"/>
    <rect x="292" y="272" width="16" height="16" rx="2" fill="#fff" stroke="#0078d4"/>
    <polyline points="296,280 302,286 312,276" fill="none" stroke="#0078d4" stroke-width="2"/>
    <text x="318" y="286" font-size="14" font-weight="600" fill="#111">Start with Windows</text>

    <text x="292" y="354" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">APPEARANCE</text>
    <text x="292" y="378" font-size="13" fill="#111">Show in</text>
    <circle cx="300" cy="400" r="8" fill="#fff" stroke="#666"/>
    <circle cx="300" cy="400" r="4" fill="#0078d4"/>
    <text x="316" y="404" font-size="14" fill="#111">System tray</text>
    <circle cx="300" cy="424" r="8" fill="#fff" stroke="#666"/>
    <text x="316" y="428" font-size="14" fill="#111">Taskbar</text>

    <!-- help pane (right column) -->
    <rect x="920" y="116" width="320" height="628" fill="#f7f9fc"/>
    <rect x="920" y="116" width="1"   height="628" fill="#e1e4ea"/>

    <text x="948" y="170" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">ABOUT THIS SETTING</text>
    <text x="948" y="206" font-size="18" font-weight="700" fill="#111">Start with Windows</text>

    <text x="948" y="246" font-size="13" fill="#222">
      <tspan x="948" dy="0">When on, Maximize All Windows</tspan>
      <tspan x="948" dy="20">launches automatically each time</tspan>
      <tspan x="948" dy="20">you sign in.</tspan>
    </text>

    <text x="948" y="334" font-size="11" font-weight="700" fill="#666" letter-spacing="0.5">WHY IT MATTERS</text>
    <text x="948" y="360" font-size="13" fill="#222">
      <tspan x="948" dy="0">Keeps the auto-maximize behavior</tspan>
      <tspan x="948" dy="20">in place without you needing to</tspan>
      <tspan x="948" dy="20">remember to start the app.</tspan>
    </text>

    <!-- tip card -->
    <rect x="948" y="450" width="264" height="120" fill="#fff" stroke="#e1e4ea" rx="6"/>
    <text x="964" y="476" font-size="11" font-weight="700" fill="#0078d4" letter-spacing="0.5">TIP</text>
    <text x="964" y="500" font-size="12" fill="#222">
      <tspan x="964" dy="0">If you also use System tray mode,</tspan>
      <tspan x="964" dy="16">the app is unobtrusive at sign-in:</tspan>
      <tspan x="964" dy="16">no window pops up, just the tray</tspan>
      <tspan x="964" dy="16">icon.</tspan>
    </text>

    <!-- footer -->
    <rect x="40" y="744" width="1200" height="56" fill="#f9f9f9"/>
    <text x="60" y="778" font-size="12" fill="#666">Version RC2 build 59 (dark-tray-menu)</text>
    <g transform="translate(960,756)">
      <rect x="0"   y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="32"  y="20" font-size="13" fill="#111">OK</text>
      <rect x="92"  y="0" width="80" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="116" y="20" font-size="13" fill="#111">Cancel</text>
      <rect x="184" y="0" width="84" height="30" fill="#fff" stroke="#bbb" rx="2"/>
      <text x="200" y="20" font-size="13" fill="#111">Exit App</text>
    </g>
  </g>

  <!-- Magnifier viewport on the right pane — finds the help content -->
  <g>
    <rect x="880" y="160" width="380" height="420" fill="none" stroke="#ffd633" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="880" y="126" width="260" height="28" fill="#222"/>
    <text x="890" y="146" font-size="13" font-weight="600" fill="#ffd633">Magnifier panned right</text>
  </g>

  <g transform="translate(40,820)">
    <text x="0" y="12" font-size="12" fill="#222"><tspan font-weight="700">Behavior:</tspan> pane content updates on focus change. With nothing focused, show a friendly summary of the page so the column is never empty.</text>
  </g>
</svg>
