# OneBranch Python Build Stage
# Parallel to build-python.yml but adapted for OneBranch conventions.

- stage: Build
  displayName: 'Build'
  jobs:
    - job: BuildJob
      displayName: 'Build Python Application'
      pool:
        type: windows
      variables:
        ob_outputDirectory: '$(Build.SourcesDirectory)\out'
      steps:
        - task: onebranch.pipeline.version@1
          displayName: 'Setup BuildNumber'
          inputs:
            system: 'RevisionCounter'
            major: '1'
            minor: '0'
            exclude_commit: true

        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: UsePythonVersion@0
          displayName: 'Set Python version'
          inputs:
            versionSpec: '<version>'

        - task: PipAuthenticate@1
          displayName: 'Authenticate with package feed'
          inputs:
            artifactFeeds: '$(feedName)'
            onlyAddExtraIndex: false

        - task: PowerShell@2
          displayName: 'Install dependencies'
          inputs:
            targetType: 'inline'
            pwsh: true
            script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt

        # CONDITIONAL: Include the following test steps ONLY when HasUnitTests=true.
        - task: PowerShell@2
          displayName: 'Run tests'
          inputs:
            targetType: 'inline'
            pwsh: true
            script: |
              pip install pytest
              pytest --junitxml=junit-results.xml --tb=short

        - task: PublishTestResults@2
          displayName: 'Publish test results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: 'junit-results.xml'

        - task: ArchiveFiles@2
          displayName: 'Archive build output'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(ob_outputDirectory)/$(Build.BuildId).zip'

        # Artifact is automatically published via ob_outputDirectory
