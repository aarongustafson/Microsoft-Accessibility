# OneBranch Java Build Stage
# Parallel to build-java.yml but adapted for OneBranch conventions.

- stage: Build
  displayName: 'Build'
  jobs:
    - job: BuildJob
      displayName: 'Build Java Application'
      pool:
        type: windows
      variables:
        ob_outputDirectory: '$(Build.SourcesDirectory)\out'
      steps:
        - task: onebranch.pipeline.version@1
          displayName: 'Setup BuildNumber'
          inputs:
            system: 'RevisionCounter'
            major: '1'
            minor: '0'
            exclude_commit: true

        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: JavaToolInstaller@0
          displayName: 'Install JDK'
          inputs:
            versionSpec: '<version>'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: MavenAuthenticate@0
          displayName: 'Authenticate with package feed'
          inputs:
            artifactsFeeds: '$(feedName)'

        # CONDITIONAL: When HasUnitTests=false, change options to '-DskipTests=true',
        # set publishJUnitResults to false, and remove testResultsFiles.
        - task: Maven@4
          displayName: 'Maven build and test'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'clean package'
            options: '-DskipTests=false'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'

        - task: CopyFiles@2
          displayName: 'Copy WAR/JAR'
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/target'
            Contents: '*.?(war|jar)'
            TargetFolder: '$(ob_outputDirectory)'

        # OFFICIAL VARIANT ONLY: Sign binaries
        - task: onebranch.pipeline.signing@1
          displayName: 'Sign binaries'
          inputs:
            command: 'sign'
            signing_environment: 'azure-ado'
            files_to_sign: '**/*.jar;**/*.war'
            search_root: '$(ob_outputDirectory)'

        # OFFICIAL VARIANT ONLY: Verify signatures
        - task: onebranch.pipeline.signing@1
          displayName: 'Verify signatures'
          inputs:
            command: 'verify'
            search_root: '$(ob_outputDirectory)'
            files_to_verify: '**/*.jar;**/*.war'

        # Artifact is automatically published via ob_outputDirectory
