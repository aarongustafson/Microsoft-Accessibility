# OneBranch Container Build Stage
# Parallel to build-container.yml but adapted for OneBranch conventions.
# For container-based apps (Dockerfile, Go, Rust) deploying to Container Apps.

- stage: Build
  displayName: 'Build'
  jobs:
    - job: BuildJob
      displayName: 'Build Container Image'
      pool:
        type: windows
      variables:
        ob_outputDirectory: '$(Build.SourcesDirectory)\out'
      steps:
        - task: onebranch.pipeline.version@1
          displayName: 'Setup BuildNumber'
          inputs:
            system: 'RevisionCounter'
            major: '1'
            minor: '0'
            exclude_commit: true

        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: Docker@2
          displayName: 'Validate Docker build'
          inputs:
            command: 'build'
            Dockerfile: '**/Dockerfile'
            tags: '$(Build.BuildId)'

        # Copy build context to output directory (excluding .git)
        - task: PowerShell@2
          displayName: 'Stage build context'
          inputs:
            targetType: 'inline'
            pwsh: true
            script: |
              $src = "$(Build.SourcesDirectory)"
              $dst = "$(ob_outputDirectory)"
              Copy-Item -Path "$src\*" -Destination $dst -Recurse -Exclude '.git'

        # Artifact is automatically published via ob_outputDirectory
