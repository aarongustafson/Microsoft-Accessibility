# EV2 Infrastructure/Application Deploy Stage
# Used ONLY with OneBranch pipelines when InfraDeployMethod == 'EV2'.
# NOT used when OneBranch uses ARM provisioning (InfraDeployMethod == 'ARM').
# When ARM is used, the standard Provision stage (AzureCLI@2 + Bicep) and
# standard Deploy stages (deploy-appservice.yml etc.) apply instead.
#
# This is a SINGLE stage that handles infrastructure provisioning via EV2.
# There is no separate ARM Provision stage when using EV2.
#
# Prerequisites:
#   - ev2/<ServiceGroupRootDir>/ must exist with RolloutSpec.json, ServiceModel.json
#   - es-metadata.yml with valid CDP_SERVICE_TREE_ID
#   - EV2 service connection: cn-ev2deploy-{service}-{environment} (Ev2Endpoint type)
#     Derived from deploy-config.json ev2.serviceConnectionPattern
#   - Build stage must copy EV2 artifacts to ob_outputDirectory, sign them, and version them
#
# Stage Naming Convention:
#   Stage name: {Ev2Env}_Deploy_{Scope}_{ProjectEnv}
#     - Ev2Env: 'Test' for Dev/Test/UAT/POC, 'Prod' for Prod
#     - Scope: 'Infra' for infrastructure provisioning, 'App' for application deployment
#     - ProjectEnv: the project's target environment (Dev, Test, UAT, POC, Prod)
#   Job name: {EV2ENV}_Managed_SDP
#     - EV2ENV: uppercase version of Ev2Env ('TEST' or 'PROD')
#
# Two stages are generated per environment:
#   1. {Ev2Env}_Deploy_Infra_{ProjectEnv} — provisions infrastructure (dependsOn: build)
#   2. {Ev2Env}_Deploy_App_{ProjectEnv}   — deploys application (dependsOn: Infra stage)
# Each stage uses a separate ServiceGroupRoot directory for its EV2 artifacts.
#
# Environment mapping (ob_release_environment):
#   Dev/Test/UAT/POC → Test
#   Prod → Production
#
# Artifact path: $(Pipeline.Workspace)/drop_build_main/ev2/<ServiceGroupRootDir>
#   - 'drop_build_main' derives from build stage name 'build' + job name 'main'
#
# Required top-level variables (set by the parent skeleton):
#   ServiceTreeId — literal GUID auto-populated from es-metadata.yml accountableOwners.service
#
# Required extends parameter:
#   ev2ManagedSdpRolloutConfig — rollout configuration block

- stage: <Ev2Env>_Deploy_<Scope>_<ProjectEnv>
  displayName: '<Ev2Env>: Deploy <Scope> <ProjectEnv>'
  dependsOn: build
  variables:
    ob_release_environment: <Ev2Env>
    ob_release_servicetreeid: $(ServiceTreeId)
  jobs:
    - job: <EV2ENV>_Managed_SDP
      displayName: '<EV2ENV>_Managed_SDP'
      pool:
        type: release
      steps:
        - download: current

        - task: vsrm-ev2.ev2-rollout.ev2-rollout-task.Ev2RARollout@2
          displayName: 'Ev2 Region Agnostic'
          inputs:
            EndpointProviderType: Ev2Endpoint
            ConnectedServiceName: 'cn-ev2deploy-<service>-<environment>'
            TaskAction: RegisterAndRollout
            ServiceRootPath: '$(Pipeline.Workspace)/drop_build_main/ev2/<ServiceGroupRootDir>'
            RolloutSpecPath: '$(Pipeline.Workspace)/drop_build_main/ev2/<ServiceGroupRootDir>/RolloutSpec.json'
            SkipRegistrationIfExists: true
            ForceRegistration: true
            StageMapVersion: '*'
            Select: 'regions(<region>)'
          timeoutInMinutes: 30
