# Static Web App Deploy Stages
# Stage 1 (Provision): Provisions infrastructure via Bicep and captures the deployment token (ARM deploy — 1ES only).
#   For OneBranch + EV2: replace this stage with deploy-ev2.yml.
# Stage 2 (Deploy): Deploys static assets via SWA CLI using the deployment token.
#   Uses npmAuthenticate + local npm install of @azure/static-web-apps-cli.
#   Runs natively on Windows — no Linux Docker dependency.
#
# Pool abstraction:
#   1ES context  → pool inherited: { name: 1ES-BuildPool, os: windows }
#   OneBranch context → pool inherited: { type: windows }
#   No pool block needed in these stages — parent skeleton provides it.

- stage: Provision
  displayName: 'Provision Infrastructure'
  dependsOn: Build
  jobs:
    - job: ProvisionJob
      displayName: 'Deploy Bicep Infrastructure'
      steps:
        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: AzureCLI@2
          displayName: 'Provision Azure infrastructure'
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              PARAM_FILE="$(Build.SourcesDirectory)/infra/parameters.dev.bicepparam"
              if [ ! -f "$PARAM_FILE" ]; then
                PARAM_FILE="$(Build.SourcesDirectory)/infra/dev.bicepparam"
              fi
              az deployment group create \
                --resource-group $(resourceGroup) \
                --template-file "$(Build.SourcesDirectory)/infra/main.bicep" \
                --parameters "$PARAM_FILE" \
                --name vsd-provision

              # Emit all Bicep deployment outputs as pipeline variables for Deploy stages
              az deployment group show \
                --resource-group $(resourceGroup) \
                --name vsd-provision \
                --query 'properties.outputs' -o json | python3 -c "
              import json, sys
              outputs = json.load(sys.stdin)
              for k, v in outputs.items():
                  val = v.get('value', '')
                  is_secret = 'true' if k.lower().endswith('token') or k.lower().endswith('key') else 'false'
                  print(f'##vso[task.setvariable variable={k};issecret={is_secret};isoutput=true]{val}')
              "
          name: bicepOutput

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Provision
  variables:
    deploymentToken: $[ stageDependencies.Provision.ProvisionJob.outputs['bicepOutput.deploymentToken'] ]
  jobs:
    - job: DeployJob
      displayName: 'Deploy to Static Web App'
      pool:
        name: 1ES-BuildPool
        os: windows
      steps:
        - task: DownloadPipelineArtifact@2
          displayName: 'Download build artifact'
          inputs:
            artifact: 'drop'
            path: '$(System.ArtifactsDirectory)/drop'

        - task: ExtractFiles@1
          displayName: 'Extract static assets'
          inputs:
            archiveFilePatterns: '$(System.ArtifactsDirectory)/drop/drop.zip'
            destinationFolder: '$(System.ArtifactsDirectory)/site'

        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: npmAuthenticate@0
          displayName: 'Authenticate npm feed'
          inputs:
            workingFile: '.npmrc'

        - pwsh: |
            npm install @azure/static-web-apps-cli
            npx swa deploy "$(System.ArtifactsDirectory)/site" --deployment-token "$(deploymentToken)" --env default
          displayName: 'Deploy to Azure Static Web Apps'
