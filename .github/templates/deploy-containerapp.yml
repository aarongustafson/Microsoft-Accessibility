# Container Apps Deploy Stages
# Stage 1 (Provision): Provisions infrastructure via Bicep (ARM deploy — 1ES only).
#   For OneBranch + EV2: replace this stage with deploy-ev2.yml.
# Stage 2 (Deploy): Builds/pushes a container image, then updates the Container App.
#   Works with both 1ES and OneBranch — pool inherited from parent skeleton.
#
# Pool abstraction:
#   1ES context  → pool inherited: { name: 1ES-BuildPool, os: windows }
#   OneBranch context → pool inherited: { type: windows }
#   No pool block needed in these stages — parent skeleton provides it.

- stage: Provision
  displayName: 'Provision Infrastructure'
  dependsOn: Build
  jobs:
    - job: ProvisionJob
      displayName: 'Deploy Bicep Infrastructure'
      steps:
        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: AzureCLI@2
          displayName: 'Provision Azure infrastructure'
          name: bicepOutput
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              PARAM_FILE="$(Build.SourcesDirectory)/infra/parameters.dev.bicepparam"
              if [ ! -f "$PARAM_FILE" ]; then
                PARAM_FILE="$(Build.SourcesDirectory)/infra/dev.bicepparam"
              fi
              az deployment group create \
                --resource-group $(resourceGroup) \
                --template-file "$(Build.SourcesDirectory)/infra/main.bicep" \
                --parameters "$PARAM_FILE" \
                --name vsd-provision

              # Emit all Bicep deployment outputs as pipeline variables for Deploy stages
              az deployment group show \
                --resource-group $(resourceGroup) \
                --name vsd-provision \
                --query 'properties.outputs' -o json | python3 -c "
              import json, sys
              outputs = json.load(sys.stdin)
              for k, v in outputs.items():
                  val = v.get('value', '')
                  print(f'##vso[task.setvariable variable={k};isoutput=true]{val}')
              "

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Provision
  variables:
    appName: $[ stageDependencies.Provision.ProvisionJob.outputs['bicepOutput.appName'] ]
  jobs:
    - job: DeployJob
      displayName: 'Deploy to Container Apps'
      steps:
        - checkout: self
          submodules: false
          persistCredentials: true
          fetchDepth: 1

        - task: Docker@2
          displayName: 'Build and push container image'
          inputs:
            containerRegistry: '$(containerRegistryConnection)'
            repository: '$(appName)'
            command: 'buildAndPush'
            Dockerfile: '**/Dockerfile'
            tags: '$(Build.BuildId)'

        - task: AzureCLI@2
          displayName: 'Update Container App'
          inputs:
            azureSubscription: '$(serviceConnection)'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az containerapp update \
                --name $(appName) \
                --resource-group $(resourceGroup) \
                --image $(acrLoginServer)/$(appName):$(Build.BuildId)
