# 1ES Pipeline Skeleton
# Every pipeline MUST follow this structure.
# All app types use pool name '1ES-BuildPool' with os: windows.
# The Linux build image (1ES-BuildPool-Ubuntu) is not yet ready.
# Do NOT add 'demands', 'image', or 'vmImage'.
# Replace Build/Deploy stage contents with the appropriate build-*.yml and deploy-*.yml templates.
#
# Pool configuration (all app types):
#   pool:
#     name: 1ES-BuildPool
#     os: windows

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  resourceGroup: '<resource-group>'
  serviceConnection: 'sc-vibe-<name>-ARM'
  appName: '<app-name>'
  # Container apps only — add these for Docker/container deployments:
  # containerRegistryConnection: 'sc-acrsandboxcuspoc-acr'
  # acrLoginServer: '<acr-login-server>'

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1ES-BuildPool
      os: windows
    sdl:
      git:
        submodules: false
      sourceAnalysisPool:
        name: 1ES-BuildPool
        os: windows
      credscan:
        enabled: true
      policheck:
        enabled: true
      checkout:
        submodules: false
    stages:
      - stage: Build
        # ... insert build jobs from build-*.yml
      - stage: Provision
        dependsOn: Build
        # ... insert provision job from deploy-*.yml (Bicep infrastructure)
      - stage: Deploy
        dependsOn: Provision
        # ... insert deploy job from deploy-*.yml (app code deployment)
