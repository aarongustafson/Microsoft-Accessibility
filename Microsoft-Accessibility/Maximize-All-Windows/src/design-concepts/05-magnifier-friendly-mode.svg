<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="desktopBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0a1b2e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#111">Concept E — Magnifier-friendly mode (auto-detected or opt-in)</text>
  <text x="40" y="58" font-size="14" fill="#555">When Windows Magnifier is running (or the user opts in), the app: opens at a compact size, centers content, scales up fonts ~25%, enlarges hit targets, and pins focus into the viewport. Combines the best of A + B.</text>

  <rect x="40" y="80" width="1200" height="720" fill="url(#desktopBg)" rx="6"/>

  <!-- compact, centered window -->
  <g filter="url(#shadow)" transform="translate(220,140)">
    <rect x="0" y="0" width="840" height="600" fill="#ffffff" rx="8"/>
    <rect x="0" y="0" width="840" height="36" fill="#fafafa" rx="8"/>
    <rect x="0" y="20" width="840" height="16" fill="#fafafa"/>
    <text x="20" y="23" font-size="13" fill="#222">Maximize All Windows</text>
    <g transform="translate(785,0)" fill="#444">
      <text x="0"  y="23" font-size="16">—</text>
      <rect x="20" y="11" width="14" height="14" fill="none" stroke="#444"/>
      <text x="44" y="23" font-size="16">✕</text>
    </g>

    <!-- sidebar (wider, larger text) -->
    <rect x="0" y="36" width="220" height="508" fill="#f3f3f3"/>
    <rect x="0" y="56" width="3"  height="44"  fill="#0078d4"/>
    <text x="28" y="84" font-size="17" font-weight="700" fill="#111">Settings</text>
    <text x="28" y="132" font-size="17" fill="#333">About</text>

    <!-- content centered, larger controls -->
    <rect x="220" y="36" width="620" height="508" fill="#ffffff"/>

    <!-- centered text -->
    <text x="260" y="92" font-size="32" font-weight="700" fill="#111">Settings</text>
    <text x="260" y="120" font-size="15" fill="#666">Configure how Maximize All Windows behaves.</text>

    <text x="260" y="180" font-size="13" font-weight="700" fill="#666" letter-spacing="0.5">GENERAL</text>
    <rect x="260" y="200" width="22" height="22" rx="3" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <polyline points="265,211 273,219 285,206" fill="none" stroke="#0078d4" stroke-width="2.5"/>
    <text x="296" y="218" font-size="18" fill="#111">Start with Windows</text>

    <text x="260" y="280" font-size="13" font-weight="700" fill="#666" letter-spacing="0.5">APPEARANCE</text>
    <text x="260" y="310" font-size="16" fill="#111">Show in</text>
    <circle cx="272" cy="338" r="11" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <circle cx="272" cy="338" r="6"  fill="#0078d4"/>
    <text x="294" y="344" font-size="18" fill="#111">System tray</text>
    <circle cx="272" cy="372" r="11" fill="#fff" stroke="#666" stroke-width="1.5"/>
    <text x="294" y="378" font-size="18" fill="#111">Taskbar</text>

    <!-- magnifier-mode chip in the corner -->
    <rect x="568" y="60" width="240" height="32" rx="16" fill="#fff4d6" stroke="#e0b84a"/>
    <circle cx="588" cy="76" r="6" fill="none" stroke="#a07a00" stroke-width="2"/>
    <line x1="592" y1="80" x2="598" y2="86" stroke="#a07a00" stroke-width="2"/>
    <text x="606" y="80" font-size="12" font-weight="600" fill="#7a5b00">Magnifier-friendly layout is on</text>

    <!-- footer -->
    <rect x="0" y="544" width="840" height="56" fill="#f9f9f9"/>
    <text x="20" y="578" font-size="13" fill="#666">Version RC2 build 59 (dark-tray-menu)</text>
    <g transform="translate(580,552)">
      <rect x="0"   y="0" width="92" height="36" fill="#fff" stroke="#bbb" rx="3"/>
      <text x="36"  y="23" font-size="14" fill="#111">OK</text>
      <rect x="104" y="0" width="92" height="36" fill="#fff" stroke="#bbb" rx="3"/>
      <text x="128" y="23" font-size="14" fill="#111">Cancel</text>
      <rect x="208" y="0" width="92" height="36" fill="#fff" stroke="#bbb" rx="3"/>
      <text x="226" y="23" font-size="14" fill="#111">Exit App</text>
    </g>
  </g>

  <!-- Magnifier viewport — comfortably contains content -->
  <g>
    <rect x="240" y="160" width="800" height="560" fill="none" stroke="#ffd633" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="240" y="126" width="260" height="28" fill="#222"/>
    <text x="250" y="146" font-size="13" font-weight="600" fill="#ffd633">Magnifier view @ ~1.6×</text>
  </g>

  <g transform="translate(40,810)">
    <text x="0" y="14" font-size="12" fill="#222"><tspan font-weight="700">Detection:</tspan> check the Magnifier registry flag (<tspan font-family="Consolas, monospace">HKCU\Software\Microsoft\ScreenMagnifier\RunningState</tspan>) at startup, and re-check on <tspan font-family="Consolas, monospace">SystemEvents.UserPreferenceChanged</tspan>.</text>
    <text x="0" y="34" font-size="12" fill="#222"><tspan font-weight="700">Opt-in:</tspan> a checkbox under a new <tspan font-style="italic">Accessibility</tspan> section lets the user force the layout on/off independent of detection.</text>
  </g>
</svg>
