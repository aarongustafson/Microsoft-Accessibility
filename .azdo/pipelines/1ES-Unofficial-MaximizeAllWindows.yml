# =====================================================================
# Maximize All Windows — 1ES Unofficial build pipeline
# =====================================================================
# Builds the .NET 8 WinForms application from
# Microsoft-Accessibility/Maximize-All-Windows/src and publishes a
# self-contained win-x64 binary as a pipeline artifact.
#
# Scope: BUILD-ONLY. No Provision/Deploy stages.
#        No Azure service connection required.
#
# Generated per VibeShield-Deploy 1ES skeleton:
#   .github/templates/1es-skeleton.yml
# Build step pattern adapted from:
#   .github/templates/build-dotnet.yml
# =====================================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

variables:
  appName: 'MaximizeAllWindows'
  buildConfiguration: 'Release'
  targetRuntime: 'win-x64'
  projectPath: 'Microsoft-Accessibility/Maximize-All-Windows/src/MaximizeAllWindows.csproj'
  # ESRP signing – configure these in ADO pipeline variables (secret)
  esrpServiceConnection: 'cn-MaximizeAllWindows-CodeSign'
  esrpCertName: 'esrp-authentication-certificate'
  esrpClientId: '050ad582-ec27-47d8-9688-a389102a8c4f'
  esrpTenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346'
  esrpKeyVaultName: 'kv-sparrow-esrp-prd'
  esrpSignCertName: 'esrp-request-signing-certificate'
  artifactsFeed: 'CELA_Demos_and_POCs/CELADemosAndPOCs'
  # Build output Universal Package
  buildPackageName: 'maximizeallwindows-win-x64'
  buildPackageVersion: '1.0.$(Build.BuildId)'
  # SDK versions:
  #   - Target framework runtime (8.x) — shared frameworks for net8.0-windows
  #   - Build SDK (9.x) — matches local 'dotnet --version' (9.0.314)
  targetFrameworkSdk: '8.x'
  buildSdkVersion: '9.x'

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: permissive,CFSClean
    pool:
      name: 1ES-BuildPool
      os: windows
    sdl:
      git:
        submodules: false
      sourceAnalysisPool:
        name: 1ES-BuildPool
        os: windows
      credscan:
        enabled: true
      policheck:
        enabled: true
      checkout:
        submodules: false
    stages:
      - stage: Build
        displayName: 'Build (Microsoft-Accessibility/src)'
        jobs:
          - job: BuildJob
            displayName: 'Build & Publish MaximizeAllWindows from Microsoft-Accessibility/src (win-x64 self-contained)'
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: 'Publish self-contained binary artifact'
                  targetPath: '$(Build.ArtifactStagingDirectory)/publish'
                  artifactName: 'MaximizeAllWindows-$(targetRuntime)'
            steps:
              - checkout: self
                submodules: false
                persistCredentials: true
                fetchDepth: 1

              # Install target framework SDK first (provides net8.0-windows runtime refs)
              - task: UseDotNet@2
                displayName: 'Install .NET 8 SDK (target framework runtime)'
                inputs:
                  packageType: 'sdk'
                  version: '$(targetFrameworkSdk)'

              # Install build SDK last — takes precedence for build tooling
              - task: UseDotNet@2
                displayName: 'Install .NET 9 SDK (build)'
                inputs:
                  packageType: 'sdk'
                  version: '$(buildSdkVersion)'

              - task: NuGetAuthenticate@1
                displayName: 'Authenticate with CFS package feed'

              - pwsh: |
                  dotnet restore "$(projectPath)" --runtime $(targetRuntime)
                displayName: 'Restore dependencies'

              # Self-contained, single-runtime publish.
              # 'dotnet publish -r ... --self-contained true' performs its own build
              # for the target runtime, so no separate 'dotnet build' step is needed.
              - pwsh: |
                  dotnet publish "$(projectPath)" `
                    --configuration $(buildConfiguration) `
                    --runtime $(targetRuntime) `
                    --self-contained true `
                    -p:PublishSingleFile=true `
                    -p:IncludeNativeLibrariesForSelfExtract=true `
                    -p:EnableCompressionInSingleFile=true `
                    --no-restore `
                    --output $(Build.ArtifactStagingDirectory)/publish
                displayName: 'Publish (self-contained, $(targetRuntime))'

              # ── Sign output binaries with ESRP ──
              - task: EsrpCodeSigning@5
                displayName: 'ESRP sign – Authenticode'
                inputs:
                  ConnectedServiceName: '$(esrpServiceConnection)'
                  AppRegistrationClientId: '$(esrpClientId)'
                  AppRegistrationTenantId: '$(esrpTenantId)'
                  AuthAKVName: '$(esrpKeyVaultName)'
                  AuthCertName: '$(esrpCertName)'
                  AuthSignCertName: '$(esrpSignCertName)'
                  FolderPath: '$(Build.ArtifactStagingDirectory)/publish'
                  Pattern: '*.msi, *MaximizeAllWindows*.exe'
                  signConfigType: 'inlineSignParams'
                  inlineOperation: |
                    [
                      {
                        "KeyCode": "CP-230012",
                        "OperationCode": "SigntoolSign",
                        "Parameters": {
                          "OpusName": "Maximize All Windows",
                          "OpusInfo": "https://github.com/microsoft/Microsoft-Accessibility",
                          "FileDigest": "/fd SHA256",
                          "PageHash": "/NPH",
                          "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                        },
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      },
                      {
                        "KeyCode": "CP-230012",
                        "OperationCode": "SigntoolVerify",
                        "Parameters": {},
                        "ToolName": "sign",
                        "ToolVersion": "1.0"
                      }
                    ]

              # ── Publish MSI to Azure Artifacts ──
              - task: UniversalPackages@0
                displayName: 'Push MSI to Azure Artifacts'
                inputs:
                  command: 'publish'
                  publishDirectory: '$(Build.ArtifactStagingDirectory)/publish'
                  feedsToUsePublish: 'internal'
                  vstsFeedPublish: '$(artifactsFeed)'
                  vstsFeedPackagePublish: '$(buildPackageName)'
                  versionOption: 'custom'
                  versionPublish: '$(buildPackageVersion)'
                  packagePublishDescription: 'SPARROW Studio MSI installer'